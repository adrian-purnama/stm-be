# Fix CORS when OPTIONS preflight never reaches Node (proxy responds first with no headers).
# Add this INSIDE the server { } or location /api/ { } block that proxies to Node.

if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin' 'https://uat-stm-portal.stm-asb.co.id' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age' 86400 always;
    add_header 'Content-Length' 0;
    return 204;
}
