# Add this inside the server {} or location {} block that proxies to your Node app.
# Use when OPTIONS preflight never reaches Node (so Node CORS never runs).
# Then the proxy sends CORS headers for OPTIONS and forwards other methods to Node.

if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin' $http_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age' 86400 always;
    add_header 'Content-Length' 0;
    return 204;
}

# Optional: if proxy strips Origin, allow your frontend explicitly:
# add_header 'Access-Control-Allow-Origin' 'https://uat-stm-portal.stm-asb.co.id' always;
